<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Virement</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px/1.45 Arial,sans-serif;background:#f4f6fa;color:#12203a}main{max-width:460px;margin:0 auto;padding:22px 16px}
h1{font-size:21px;margin:0 0 4px}p{margin:0 0 16px;color:#5a6780}.c{background:#fff;border:1px solid #d6deea;border-radius:12px;padding:14px;margin-bottom:12px}
.c small{display:block;color:#5a6780;font-size:13px}.c b{display:block;font-size:17px;word-break:break-all;margin:2px 0 8px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#12203a;color:#fff;font:600 15px Arial}button.ok{background:#1b7a3d}.n{font-size:13px;color:#5a6780}</style></head><body><main>
<h1 id="t">Virement</h1><p>Copiez les informations dans votre application bancaire.</p><div id="o"></div>
<p class="n" id="msg"></p>
<script>
const q=new URLSearchParams(location.hash.slice(1)),g=k=>q.get(k)||'';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grp=s=>s.replace(/\s+/g,'').replace(/(.{4})/g,'$1 ').trim();
document.getElementById('t').textContent='Virement à '+(g('n')||'Aurora Solutions');
const rows=[['Bénéficiaire',g('n')],['IBAN',grp(g('i')),g('i').replace(/\s+/g,'')],['BIC',g('b')],['Montant',g('m')?Number(g('m')).toFixed(2).replace('.',',')+' €':'',g('m')?Number(g('m')).toFixed(2):''],['Référence à indiquer',g('r')]].filter(r=>r[1]);
if(!g('i')){document.getElementById('o').innerHTML='<div class="c">Lien incomplet. Merci de nous demander un nouveau lien.</div>'}
document.getElementById('o').innerHTML=rows.map((r,i)=>'<div class="c"><small>'+esc(r[0])+'</small><b>'+esc(r[1])+'</b><button data-v="'+esc(r[2]||r[1])+'">Copier</button></div>').join('');
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-v]');if(!b)return;try{await navigator.clipboard.writeText(b.dataset.v);b.textContent='Copié';b.classList.add('ok');setTimeout(()=>{b.textContent='Copier';b.classList.remove('ok')},1800)}catch(x){document.getElementById('msg').textContent='Copie impossible : sélectionnez le texte à la main.'}});
</script></main></body></html>
