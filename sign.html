<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Signature du devis · Aurora Solutions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#182d53;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}p{margin:8px 0}.mut{color:#5d6b82;font-size:14px}
.card{background:#fff;border:1px solid #dfe5ee;border-radius:12px;padding:16px;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #eef1f5}.row:last-child{border:0}.row.strong b{font-size:17px}
iframe{width:100%;height:60vh;}.pv{overflow:auto;height:70vh;touch-action:pan-x pan-y;overscroll-behavior:contain;border:1px solid #dfe5ee;border-radius:8px;background:#e9edf3;-webkit-overflow-scrolling:touch}#pz{width:100%}#pz img{display:block;width:100%;height:auto;margin:0 0 6px;background:#fff;box-shadow:0 1px 3px #0002}.zbar{display:flex;align-items:center;gap:10px;margin:4px 0 8px}.zbar .z{width:40px;height:40px;padding:0;border-radius:10px;background:#eef2f8;color:#182d53;font-size:22px}.zbar span{font-size:14px}#zl{white-space:nowrap;min-width:52px;text-align:center}.zz{border:1px solid #dfe5ee;border-radius:8px;background:#fff}
a.btn,button{display:inline-block;border:0;border-radius:10px;padding:13px 18px;font-weight:600;font-size:16px;font-family:inherit;cursor:pointer;text-decoration:none}
a.btn{background:#eef2f8;color:#182d53}button.p{background:#182d53;color:#fff;width:100%}button.p:disabled{opacity:.45}
button.l{background:none;color:#5d6b82;padding:6px 0;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 6px}input[type=text]{width:100%;padding:12px;font-size:16px;border:1px solid #c9d3e3;border-radius:8px}
canvas{width:100%;height:180px;border:1px dashed #9fb0c8;border-radius:8px;background:#fff;touch-action:none;display:block}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}.ck input{width:22px;height:22px;flex:none;margin-top:1px}
#err{color:#b3261e;font-weight:600;min-height:1.2em}.ok{background:#e8f6ec;border-color:#b9e2c4}
</style></head>
<body><main>
<div class="mut">Aurora Solutions · Électricité</div>
<h1 id="t">Signature du devis</h1>
<div id="box"><p class="mut">Chargement…</p></div>
</main>
<script>
(()=>{const FN='https://pizfosqeoaowvkmwiyce.supabase.co/functions/v1/sign';
const t=(new URLSearchParams(location.hash.slice(1))).get('t')||'';
const box=document.getElementById('box'),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fdt=s=>new Date(s).toLocaleString('fr-FR',{dateStyle:'long',timeStyle:'short'});
const fail=m=>box.innerHTML='<div class="card"><p id="err">'+E(m)+'</p></div>';
if(!/^[A-Za-z0-9_-]{40,64}$/.test(t))return fail('Lien invalide. Vérifiez le lien reçu par e-mail ou SMS.');
fetch(FN+'?t='+encodeURIComponent(t)).then(r=>r.json()).then(j=>{
 if(j.error)return fail(j.error);
 document.getElementById('t').textContent='Devis n° '+j.num;
 if(j.status==='signed'){box.innerHTML='<div class="card ok"><p><b>Ce devis est déjà signé.</b></p><p class="mut">Signé par '+E(j.signer)+' le '+E(fdt(j.signed_at))+'.</p></div>';return}
 const R=j.recap||{},rw=(l,v,s)=>v?`<div class="row${s?' strong':''}"><span>${l}</span><b>${E(v)}</b></div>`:'';
 box.innerHTML=`<div class="card"><p><b>Récapitulatif de ce que vous signez</b></p>${rw('Client',j.client)}${rw('Objet',j.objet)}${rw('Date du devis',R.date)}${rw('Montant HT',R.ht)}${rw('TVA',R.tva)}${rw('Total TTC',R.ttc||j.montant,1)}${R.acompte?rw('Acompte à la signature',R.acompte+' soit '+R.acompteTTC+' TTC',1)+rw('Reste à régler',R.reste+' TTC'):''}${rw('Paiement',R.paiement)}${rw('Début des travaux',R.debut)}${rw('Durée estimée',R.duree)}${rw('Offre valable jusqu’au',R.validite)}<p class="mut">Après signature, ${j.has_mail?'vous recevez le devis signé par e-mail':'le devis signé est transmis à Aurora Solutions'}. Vous disposez d’un droit de rétractation de 14 jours.</p></div>
 <div class="card"><p><b>1. Lisez le devis et ses conditions générales</b></p>${(j.pages&&j.pages.length)?`<div class="zbar"><button type="button" class="z" data-z="-">−</button><span id="zl">100 %</span><button type="button" class="z" data-z="+">+</button><span class="mut" id="zh">Deux doigts pour zoomer</span></div><div class="pv" id="pv"><div id="pz">${j.pages.map((u,i)=>`<img src="${E(u)}" alt="Page ${i+1}" loading="lazy">`).join('')}</div></div>`:`<iframe src="${E(j.pdf)}" title="Devis"></iframe>`}<p><a class="btn" href="${E(j.pdf)}" target="_blank" rel="noopener">Ouvrir le devis en PDF</a></p></div>
 <div class="card"><p><b>2. Signez</b></p>
 <label for="n">Vos nom et prénom</label><input type="text" id="n" autocomplete="name" maxlength="80">
 <label>Votre signature</label><canvas id="c"></canvas><button type="button" class="l" id="clr">Effacer la signature</button>
 <label class="ck"><input type="checkbox" id="a"> <span>Bon pour accord. J'accepte le devis n° ${E(j.num)} et ses conditions générales de vente, et je reconnais avoir été informé(e) de mon droit de rétractation de 14 jours.</span></label>
 <p id="err"></p><button type="button" class="p" id="s">Signer le devis</button>
 <p class="mut">Votre nom, la date, l'heure et l'adresse IP de votre connexion sont enregistrés comme preuve de signature.</p></div>`;
 if(matchMedia('(pointer:fine)').matches){const h=document.getElementById('zh');if(h)h.textContent='Ctrl + molette pour zoomer'}
 let zf=1;const pz=document.getElementById('pz'),pv=document.getElementById('pv'),zl=document.getElementById('zl');
 if(pv){const setZ=(z,cx,cy)=>{z=Math.max(.5,Math.min(4,z));const o=zf;if(Math.abs(z-o)<.001)return;const px=(pv.scrollLeft+cx)/o,py=(pv.scrollTop+cy)/o;zf=z;pz.style.width=(zf*100)+'%';pv.scrollLeft=px*zf-cx;pv.scrollTop=py*zf-cy;zl.textContent=Math.round(zf*100)+' %'};
  const mid=()=>[pv.clientWidth/2,pv.clientHeight/2];
  document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>setZ(zf+(b.dataset.z==='+'?.25:-.25),...mid()));
  pv.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const r=pv.getBoundingClientRect();setZ(zf*Math.exp(-e.deltaY*.0025),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  let p0=null;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  pv.addEventListener('touchstart',e=>{if(e.touches.length===2){const r=pv.getBoundingClientRect();p0={d:dist(e.touches),z:zf,cx:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,cy:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}}},{passive:true});
  pv.addEventListener('touchmove',e=>{if(e.touches.length===2&&p0){e.preventDefault();setZ(p0.z*dist(e.touches)/p0.d,p0.cx,p0.cy)}},{passive:false});
  pv.addEventListener('touchend',e=>{if(e.touches.length<2)p0=null});
  ['gesturestart','gesturechange'].forEach(k=>pv.addEventListener(k,e=>e.preventDefault()));
  let lastTap=0;pv.addEventListener('click',e=>{const n=Date.now();if(n-lastTap<300){const r=pv.getBoundingClientRect();setZ(zf>1.2?1:2,e.clientX-r.left,e.clientY-r.top)}lastTap=n});
 }
 const c=document.getElementById('c'),x=c.getContext('2d');let drawn=false,down=false,last=null;
 const fit=()=>{const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.scale(d,d);x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#182d53';drawn=false};fit();
 const pt=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 c.addEventListener('pointerdown',e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId)});
 c.addEventListener('pointermove',e=>{if(!down)return;const p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;drawn=true});
 ['pointerup','pointercancel'].forEach(k=>c.addEventListener(k,()=>down=false));
 document.getElementById('clr').onclick=()=>{x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);fit()};
 const err=m=>document.getElementById('err').textContent=m;
 document.getElementById('s').onclick=async ev=>{const b=ev.target,name=document.getElementById('n').value.trim();
  if(name.length<3)return err('Indiquez vos nom et prénom.');if(!drawn)return err('Signez dans le cadre.');if(!document.getElementById('a').checked)return err('Cochez la case « Bon pour accord ».');
  err('');b.disabled=true;b.textContent='Enregistrement…';
  try{const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t,name,accept:true,png:c.toDataURL('image/png')})});const k=await r.json();
   if(!r.ok||!k.ok)throw new Error(k.error||'Erreur');
   box.innerHTML='<div class="card ok"><p><b>Merci, votre devis est signé.</b></p><p class="mut">Signé par '+E(name)+' le '+E(fdt(k.signed_at))+'. '+(k.mailed?'Vous allez recevoir le devis signé par e-mail dans quelques minutes. ':'')+'Nous revenons vers vous très vite pour la suite.</p></div>';
  }catch(e){b.disabled=false;b.textContent='Signer le devis';err(e.message)}};
}).catch(()=>fail('Connexion impossible. Réessayez dans un instant.'));
})();
</script>
</body></html>
